  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ownsFullscreen())root.querySelector('[data-action=close]').click();});
  const observer = new ResizeObserver(fit); observer.observe(area);
  window.addEventListener('resize',()=>{
    stopMotion();render();prepareDragSlides();
  });
  root.querySelector('.ss-tools').addEventListener('scroll',()=>{fit();prepareDragSlides();},{passive:true});
  options.addEventListener('transitionend',()=>{fit();prepareDragSlides();});
  let initialized=false;
  function applySafeInsets(value) {
    for(const side of ['top','right','bottom','left']){
      const amount=Number(value?.[side]);
      root.style.setProperty('--ss-safe-'+side,(Number.isFinite(amount)?Math.max(0,Math.min(200,amount)):0)+'px');
    }
  }
  window.addEventListener('message',async event=>{
    if(event.source!==parent)return;
    if(event.data?.type==='slokamrita-slides-viewport'){stopMotion();applySafeInsets(event.data.safeInsets);render();prepareDragSlides();return;}
    if(event.data?.type==='slokamrita-slides-theme'){
      stopMotion();state.theme=THEMES.includes(event.data.theme)?event.data.theme:'light';render();prepareDragSlides();return;
    }
    if(event.data?.type==='slokamrita-slides-close-error'){showError(event.data.message);return;}
    if(event.data?.type!=='slokamrita-slides-init')return;
    if(!Array.isArray(event.data.samples)||!event.data.samples.length)return;
    if(initialized)return;initialized=true;
    samples=event.data.samples;interfaceLocale=event.data.locale;
    root.dataset.native=String(event.data.native===true);
    applySafeInsets(event.data.safeInsets);
    state.sample=samples[Math.max(0,Math.min(samples.length-1,event.data.initialIndex||0))].slug;
    state.theme=savedTheme()||(THEMES.includes(event.data.theme)?event.data.theme:'light');
    state.script=event.data.locale==='en'?'iast':'ru';
    state.visible=normalizeVisible(event.data.visible);
    for(const icon of root.querySelectorAll('[data-lucide]')){
      const markup=event.data.icons?.[icon.dataset.lucide];if(markup)icon.outerHTML=markup;
    }
    render();
    try {
      await Promise.all([
        document.fonts.load('18px "Gaura PT Serif"'),document.fonts.load('500 18px "Gaura PT Serif"'),
        document.fonts.load('18px "Vedarama Serif"'),document.fonts.load('italic 18px "Vedarama Serif"'),
        document.fonts.load('18px "PT Sans"'),document.fonts.load('18px "Noto Sans Devanagari"'),
        ...['parchment.webp'].map(src=>{const img=new Image();img.src=src;return img.decode();})
      ]);
      fit();prepareDragSlides();root.dataset.ready='true';
      parent.postMessage({type:'slokamrita-slides-paint-ready'},'*');
    } catch {
      parent.postMessage({type:'slokamrita-slides-init-error'},'*');return;
    }
    if(event.data.locale==='en'){
      const labels={'Закрыть слайд-шоу':'Close slideshow','Переключить тему':'Switch theme','Развернуть на весь экран':'Enter fullscreen','Режим отображения':'Display options','Санскрит':'Sanskrit','Надстрочный перевод':'Interlinear translation','Пословный перевод':'Word-for-word translation','Литературный перевод':'Translation','Предыдущий стих':'Previous verse','Следующий стих':'Next verse'};
      for(const el of root.querySelectorAll('[aria-label]')){const label=labels[el.getAttribute('aria-label')];if(label){el.setAttribute('aria-label',label);el.title=label;}}
    }
  });
  parent.postMessage({type:'slokamrita-slides-ready'},'*');
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='system')render();});
})();
</script>
</body></html>
